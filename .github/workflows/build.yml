name: Build and Deploy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses || true

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 复制 APK
        run: |
          find app/build/outputs/apk -name "*.apk"
          cp app/build/outputs/apk/debug/app-debug.apk app.apk
          ls -lh app.apk

      - name: 推送到 apk 分支
        run: |
          mkdir -p /tmp/apk-deploy
          cd /tmp/apk-deploy
          git init -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp $GITHUB_WORKSPACE/app.apk .
          git add app.apk
          git commit -m "apk"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
